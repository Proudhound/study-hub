name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Public-repo guard, source check and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.16.0'
          cache: npm
      - name: Install locked dependencies (none yet)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check for accidental public-data disclosure
        run: npm run check:public
      - name: Check source syntax
        run: npm run check:source
      - name: Run domain, theme and dashboard tests
        run: npm test
