name: "👤 User Story"
description: "Produkt-, UX- oder optionale Nutzerfunktion"
title: "[SH-CLASS-DOMAIN-NNN] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: "Öffentliches Repository: ausschließlich synthetische Beispiele. Keine persönlichen Studiendaten, Hochschulunterlagen, privaten Hosts, Keys oder Screenshots mit vertraulichen Inhalten. Issues sind zunächst Backlog/Discovery; der DoR-Check ist eine spätere Freigabe, keine Pflichtbestätigung beim Einreichen. ID-Schema: SH-[CORE|DES|OPT]-[DOMAIN]-NNN. Ein Developer darf erst starten, wenn das Issue für Ready freigegeben ist."
  - type: dropdown
    id: class
    attributes:
      label: "Class / Produktrelevanz"
      options: ["CORE – Kernfunktion","DES – Design / UX","OPT – optionale Erweiterung"]
    validations:
      required: true
  - type: dropdown
    id: domain
    attributes:
      label: "Primäre Domain"
      options: ["AUTH","STUDY","MOD","ECTS","ELEC","ROAD","DASH","LEARN","EXAM","LIB","UI","AI","API","DB","SEC","OPS","CI","DOC","CROSS"]
    validations:
      required: true
  - type: dropdown
    id: actor
    attributes:
      label: "Nutzerrolle"
      options: ["USER","ADMIN","MAINTAINER"]
    validations:
      required: true
  - type: textarea
    id: story
    attributes:
      label: "User Story"
      value: "Als [Rolle] möchte ich ... damit ..."
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: "Ziel und Nutzen"
    validations:
      required: true
  - type: textarea
    id: behaviour
    attributes:
      label: "Erwartetes Verhalten / Nutzerablauf"
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: "Scope und Out of Scope"
      description: "Was ist konkret enthalten, was ausdrücklich nicht?"
    validations:
      required: false
  - type: textarea
    id: acceptance
    attributes:
      label: "Akzeptanzkriterien (AC-1, AC-2 ...)"
      placeholder: "- [ ] AC-1: ...\n- [ ] AC-2: ..."
    validations:
      required: true
  - type: textarea
    id: edge
    attributes:
      label: "Edge Cases / Fehlerfälle"
    validations:
      required: false
  - type: textarea
    id: references
    attributes:
      label: "Referenzen, Abhängigkeiten, DEC / ADR"
      description: "Bestehende öffentliche Dokumentation, GitHub Issues, bestätigte Decisions oder bewusst 'Keine'."
    validations:
      required: false
  - type: textarea
    id: security
    attributes:
      label: "Datenfluss / Berechtigungen / Privacy / Lizenzen"
      description: "Angeben, ob Auth, personenbezogene Daten, Fremdcode, Lizenzen oder externe Anbieter betroffen sind."
    validations:
      required: false
  - type: textarea
    id: open_questions
    attributes:
      label: "Offene Fragen / Decision erforderlich?"
      description: "Nicht geklärte Produkt-/Architekturfragen dürfen nicht stillschweigend implementiert werden."
    validations:
      required: false
  - type: textarea
    id: verification
    attributes:
      label: "Verifikationsplan je AC"
      description: "Vor der Implementierung objektive Prüfungen festlegen; automatisiert bevorzugt. Manuelle Tests kennzeichnen."
      placeholder: "AC-1 → npm test ...\nAC-2 → manueller Browsercheck ..."
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: "Vorgeschlagene Priorität (PO bestätigt bei Triage)"
      options: ["Unbewertet","P0 – kritischer Blocker","P1 – zwingender nächster Delivery-Horizont","P2 – strategisch","P3 – später/optional"]
    validations:
      required: true
